```yaml
databases:
  - name: popin-postgres
    plan: free
    databaseName: popin
    user: popin

services:
  - type: web
    name: popin-api
    runtime: docker
    plan: free
    autoDeploy: true
    healthCheckPath: /health

    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: popin-postgres
          property: connectionString

      - key: JWT_SECRET
        generateValue: true

      - key: NODE_ENV
        value: production

      - key: CORS_ORIGINS
        value: https://popin-frontend.onrender.com

      - key: SERVICE_ACCOUNT_PATH
        value: /etc/secrets/service-account.json
```
