# Render Blueprint - Popin backend
# الاستخدام: Render > New + > Blueprint > لصق رابط هذا الريبو
# سينشئ: قاعدة بيانات Postgres + خدمة الويب (Docker)

databases:
  - name: popin-postgres
    plan: free
    databaseName: popin
    user: popin

services:
  - type: web
    name: popin-api
    runtime: docker
    repo: https://github.com/amaramar666678-debug/popin-backend.git
    plan: free
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: popin-postgres
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGINS
        value: https://popin-frontend.onrender.com
      - key: NODE_ENV
        value: production
