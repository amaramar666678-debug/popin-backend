databases:
  - name: popin-postgres
    plan: free
    databaseName: popin
    user: popin

services:
  - type: web
    name: popin-api
    runtime: docker
    plan: free
    autoDeploy: true
    preDeployCommand: npm run migrate:deploy
    healthCheckPath: /health

    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: popin-postgres
          property: connectionString

      - key: JWT_SECRET
        generateValue: true

      - key: NODE_ENV
        value: production

      - key: CORS_ORIGINS
        value: https://popin-frontend.onrender.com

      # Optional:
      # - key: EMAIL_USER
      #   sync: false

      # - key: TELEGRAM_BOT_TOKEN
      #   sync: false

      # - key: TELEGRAM_ADMIN_GROUP_ID
      #   sync: false