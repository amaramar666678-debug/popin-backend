worker_processes auto;

events {
  worker_connections 4096;
}

http {
  include       mime.types;
  default_type  application/octet-stream;
  sendfile      on;
  keepalive_timeout 65;

  # TLS hardening
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_prefer_server_ciphers on;
  ssl_session_cache shared:SSL:10m;
  ssl_session_timeout 10m;

  # Rate limit per IP for the API
  limit_req_zone $binary_remote_addr zone=api_limit:10m rate=30r/s;

  # Block oversized bodies (backend already caps at 10mb; media is 25mb)
  client_max_body_size 26m;

  upstream popin_api {
    server api:3000;
    keepalive 32;
  }

  # HTTP -> HTTPS redirect
  server {
    listen 80;
    server_name api.popin.app;
    return 301 https://$host$request_uri;
  }

  server {
    listen 443 ssl http2;
    server_name api.popin.app;

    ssl_certificate     /etc/letsencrypt/live/api.popin.app/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.popin.app/privkey.pem;

    # Security headers (helmet is also applied at the app layer)
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;

    location / {
      limit_req zone=api_limit burst=60 nodelay;
      proxy_pass http://popin_api;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;

      # WebSocket (Socket.IO)
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
      proxy_read_timeout 86400;
    }

    # Expose uploads directly (cacheable, served via the app's /uploads route too)
    location /uploads/ {
      proxy_pass http://popin_api;
      proxy_set_header Host $host;
      expires 30d;
    }
  }
}
